[project]
name = "stardew-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Edgar", email = "edgar.zx.liao@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "uvicorn==0.54.0",
]

[project.scripts]
stardew-agent = "stardew_agent:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]
